<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AndyLe Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #1b2721;
    --washi: rgba(244, 246, 239, 0.84);
    --ink: #16211c;
    --ink-soft: #52625a;
    --rule: rgba(22, 33, 28, 0.16);
    --koi: #cf5427;
    --koi-ink: #fff7f0;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    overflow: hidden;
    font: 14px/1.45 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #pond { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  .panel {
    background: var(--washi);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(8, 16, 12, 0.22);
  }
  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 0;
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .brand { padding: 9px 16px 9px 10px; display: flex; align-items: center; gap: 10px; }
  .brand svg { flex: none; }
  .brand .name { font-family: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif; font-size: 21px; line-height: 1; letter-spacing: 0.01em; }
  .brand .sub { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em; }

  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .controls { display: flex; gap: 6px; padding: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--ink);
    border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background-color .2s, color .2s;
  }
  button:hover { background: rgba(22, 33, 28, 0.08); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--koi); outline-offset: 2px; }
  button svg { width: 17px; height: 17px; flex: none; }
  .ghost { border: 1px solid var(--rule); }
  #music[aria-pressed="true"] { background: var(--koi); color: var(--koi-ink); }
  .vol { display: flex; align-items: center; padding: 0 6px; }
  .vol input { width: 84px; accent-color: var(--koi); }
  .status {
    font-size: 12px; color: var(--ink-soft); padding: 6px 12px; max-width: min(340px, calc(100vw - 32px));
    text-align: right;
  }
  .status b { color: var(--ink); font-weight: 600; }
  .status code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }

  .bottom {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 0 16px; pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  .hint {
    font-size: 12px; color: #f2f5ef; text-align: center; text-wrap: balance;
    background: rgba(16, 24, 20, 0.42); padding: 4px 12px; border-radius: 999px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .hint b { font-weight: 600; }
  .dock { display: flex; align-items: stretch; gap: 2px; padding: 5px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .dock .grp { display: flex; gap: 2px; flex: none; }
  .dock .sep { flex: none; width: 1px; background: var(--rule); margin: 6px 5px; }
  .dock button { flex: none; flex-direction: column; gap: 3px; padding: 7px 8px 6px; min-width: 64px; font-size: 11.5px; }
  .dock button svg { width: 20px; height: 20px; }
  .dock button[aria-pressed="true"] { background: var(--koi); color: var(--koi-ink); }

  .loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--ground); color: #d9e2da; font-size: 14px; letter-spacing: 0.03em;
    transition: opacity .8s ease;
  }
  .loading.done { opacity: 0; pointer-events: none; }
  body.clean .hud, body.clean .bottom { display: none; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 760px) { .hint { display: none; } }
  @media (max-width: 520px) {
    .brand .sub, .vol { display: none; }
    .dock button { min-width: 56px; padding: 6px 5px 5px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { button, .loading { transition: none; } }
</style>

      <button data-scene="autumn" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>Mùa thu</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeVertices, mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

/* =========================================================
   NHẠC NỀN: đặt file vào thư mục "music/" cạnh index.html.
   Tên file theo cảnh (đuôi .mp3 / .m4a / .ogg / .wav):
     sunny, sunset, night, rain, storm, spring, summer, autumn, winter
   default.* dùng cho cảnh chưa có file riêng.
   ========================================================= */
const MUSIC_DIR = "music/";
const MUSIC_EXTS = ["mp3", "m4a", "ogg", "wav"];
const SCENE_MUSIC = {
  sunny: ["sunny"], sunset: ["sunset"], night: ["night"], rain: ["rain"], storm: ["storm"],
  spring: ["spring"], summer: ["summer"], autumn: ["autumn"], winter: ["winter", "snow"],
};
const SCENE_LABEL = {
  sunny: "Nắng đẹp", sunset: "Hoàng hôn", night: "Đêm", rain: "Mưa", storm: "Sấm sét",
  spring: "Mùa xuân", summer: "Mùa hạ", autumn: "Mùa thu", winter: "Mùa đông",
};
const SCENE_KEYS = ["sunny", "sunset", "night", "rain", "storm", "spring", "summer", "autumn", "winter"];

/* ---------- math helpers ---------- */
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrap = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const approach = (v, g, step) => (v < g ? Math.min(g, v + step) : Math.max(g, v - step));
let seedState = 20240917;
function rnd() { seedState ^= seedState << 13; seedState ^= seedState >>> 17; seedState ^= seedState << 5; return ((seedState >>> 0) % 1000003) / 1000003; }
const rand = (a, b) => a + (b - a) * rnd();
const pick = (arr) => arr[Math.floor(rnd() * arr.length) % arr.length];
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => (vnoise(x, y) * 0.5 + vnoise(x * 2.03, y * 2.03) * 0.25 + vnoise(x * 4.1, y * 4.1) * 0.125) / 0.875;
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);

/* ---------- pond shape ---------- */
function pondR(th) { return 9.4 + 0.9 * Math.sin(2 * th + 0.6) + 0.55 * Math.sin(3 * th + 2.1) + 0.3 * Math.sin(5 * th + 0.3); }
function pondD(x, z) { return Math.hypot(x, z) / pondR(Math.atan2(z, x)); }
function terrainH(x, z) {
  const d = pondD(x, z);
  let y = lerp(-2.6, -0.2, smooth(0.35, 1.0, d));
  y += 0.62 * smooth(0.97, 1.12, d);
  y += (fbm(x * 0.35 + 10, z * 0.35) - 0.45) * 0.6 * smooth(1.1, 1.6, d);
  y += (fbm(x * 1.7, z * 1.7) - 0.5) * 0.14 * (1 - smooth(0.95, 1.05, d));
  return y;
}

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById("pond");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
} catch (err) {
  document.getElementById("loading").textContent = "Trình duyệt này chưa bật WebGL nên không vẽ được hồ 3D.";
  throw err;
}
const PR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaebfb3, 34, 78);
scene.background = new THREE.Color();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 140);
camera.position.set(0, 15, 15.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, -0.6, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 34;
controls.minPolarAngle = 0.05;
controls.maxPolarAngle = 1.22;
controls.rotateSpeed = 0.55;

const hemi = new THREE.HemisphereLight(0xcfe0f0, 0x4a5a3a, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3df, 2.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -20; sc.right = 20; sc.top = 20; sc.bottom = -20; sc.near = 1; sc.far = 90;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 3;
sun.shadow.camera.layers.enableAll();
scene.add(sun, sun.target);
const flashLight = new THREE.DirectionalLight(0xdfe6ff, 0);
flashLight.position.set(-8, 20, -5);
scene.add(flashLight);

/* ---------- shared shading: caustics, underwater absorption, snow, dry grass ---------- */
const U = {
  uTime: { value: 0 },
  uSunCol: { value: new THREE.Color() },
  uWaterCol: { value: new THREE.Color() },
  uAbsorb: { value: new THREE.Vector3(0.45, 0.13, 0.18) },
  uCausticAmt: { value: 1 },
  uSnowCover: { value: 0 },
  uDry: { value: 0 },
};
const snowLight = new THREE.Color(1, 1, 1);
const CAUSTIC = /* glsl */`
float causticF(vec2 uv, float t) {
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}`;
function underwater(mat, { caustic = 1, snow = 1, dry = false } = {}) {
  const defs = { ...(mat.defines || {}) };
  if (snow > 0) defs.SNOWY = "";
  if (dry) defs.DRYABLE = "";
  mat.defines = defs;
  mat.onBeforeCompile = (sh) => {
    for (const k of Object.keys(U)) sh.uniforms[k] = U[k];
    sh.uniforms.uCausticScale = { value: caustic };
    sh.uniforms.uSnowAmt = { value: snow };
    sh.vertexShader = "varying vec3 vWPos;\n" + sh.vertexShader.replace("#include <project_vertex>", `#include <project_vertex>
      vec4 wp4 = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        wp4 = instanceMatrix * wp4;
      #endif
      vWPos = (modelMatrix * wp4).xyz;`);
    sh.fragmentShader = `varying vec3 vWPos;
      uniform float uTime; uniform vec3 uSunCol; uniform vec3 uWaterCol; uniform vec3 uAbsorb;
      uniform float uCausticAmt; uniform float uCausticScale; uniform float uSnowCover; uniform float uSnowAmt; uniform float uDry;
      ${CAUSTIC}
      ` + sh.fragmentShader.replace("#include <normal_fragment_maps>", `#include <normal_fragment_maps>
      #ifdef DRYABLE
      if (vWPos.y > 0.0) {
        float lum = dot(diffuseColor.rgb, vec3(0.3, 0.59, 0.11));
        float dm = smoothstep(0.02, 0.12, vWPos.y);
        vec3 dryC = vec3(0.36, 0.26, 0.12) * (0.7 + lum * 3.0);
        vec3 lushC = diffuseColor.rgb * vec3(0.8, 1.22, 0.72);
        diffuseColor.rgb = uDry >= 0.0 ? mix(diffuseColor.rgb, dryC, uDry * dm) : mix(diffuseColor.rgb, lushC, -uDry * dm * 2.0);
      }
      #endif
      #ifdef SNOWY
      if (uSnowCover > 0.001) {
        vec3 upS = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);
        float sp = fract(sin(dot(floor(vWPos.xz * 22.0), vec2(12.9898, 78.233))) * 43758.5453);
        float big = fract(sin(dot(floor(vWPos.xz * 3.0), vec2(39.34, 11.13))) * 24634.63);
        float fac = dot(normal, upS) + (sp - 0.5) * 0.3;
        float m = smoothstep(0.2, 0.62, fac) * smoothstep(0.01, 0.05, vWPos.y)
                * clamp(uSnowCover * 1.35 - sp * 0.25 - big * 0.2, 0.0, 1.0) * uSnowAmt;
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.9, 0.92, 0.96) * (0.94 + 0.06 * sp), m);
        roughnessFactor = mix(roughnessFactor, 0.75, m);
      }
      #endif
      `).replace("#include <opaque_fragment>", `
      if (vWPos.y < 0.0) {
        vec3 upV = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);
        float uwD = -vWPos.y;
        float facing = clamp(dot(normal, upV), 0.0, 1.0);
        float cs = causticF(vWPos.xz * 0.085, uTime * 0.55) * 0.65 + causticF(vWPos.xz * 0.121 + vec2(0.37, 0.11), uTime * 0.63) * 0.5;
        outgoingLight += diffuseColor.rgb * uSunCol * cs * uCausticAmt * uCausticScale * facing * exp(-uwD * 0.3) * smoothstep(0.0, 0.15, uwD);
        vec3 ab = exp(-uAbsorb * uwD);
        outgoingLight = mix(outgoingLight * ab, uWaterCol, 1.0 - exp(-0.3 * uwD));
      }
      #include <opaque_fragment>`);
  };
  return mat;
}

/* ---------- terrain ---------- */
{
  const TS = 90, SEG = 300;
  const g = new THREE.PlaneGeometry(TS, TS, SEG, SEG);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const cSand = srgb(0.64, 0.58, 0.47), cPebble = srgb(0.4, 0.38, 0.34), cDark = srgb(0.22, 0.21, 0.2);
  const cAlgae = srgb(0.3, 0.37, 0.22), cMud = srgb(0.3, 0.25, 0.18), cMoss = srgb(0.2, 0.32, 0.13), cGrass = srgb(0.36, 0.46, 0.19);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrainH(x, z));
    const d = pondD(x, z);
    if (d < 1.03) {
      c.copy(cSand).lerp(cPebble, smooth(0.4, 0.65, fbm(x * 1.3, z * 1.3)));
      c.lerp(cDark, smooth(0.66, 0.78, vnoise(x * 4.5, z * 4.5)) * 0.6);
      c.lerp(cAlgae, smooth(0.45, 0.72, fbm(x * 0.25 + 5, z * 0.25)) * 0.65);
      c.lerp(cMud, smooth(0.9, 1.03, d));
    } else {

/* ---------- falling leaves (autumn) & blossom petals (spring) ---------- */
const fall = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g2 = c.getContext("2d");
  g2.fillStyle = "#fff";
  g2.beginPath(); g2.moveTo(32, 3);
  g2.bezierCurveTo(54, 16, 54, 44, 32, 61); g2.bezierCurveTo(10, 44, 10, 16, 32, 3); g2.fill();
  g2.strokeStyle = "rgba(120,90,60,0.55)"; g2.lineWidth = 2;
  g2.beginPath(); g2.moveTo(32, 6); g2.lineTo(32, 60); g2.stroke();
  g2.lineWidth = 1.2;
  for (const y of [20, 32, 44]) { g2.beginPath(); g2.moveTo(32, y + 6); g2.lineTo(20, y - 2); g2.moveTo(32, y + 6); g2.lineTo(44, y - 2); g2.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const n = 340;
  const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.7 }), n);
  mesh.layers.set(1); mesh.castShadow = true; mesh.frustumCulled = false;
  const LEAF = ["#e8b422", "#e08a1e", "#c9461d", "#a8642a", "#f0cf4a", "#d9701f"].map((h) => new THREE.Color(h));
  const PETAL = ["#f9c6d6", "#fde8ef", "#f4a9c0", "#ffffff"].map((h) => new THREE.Color(h));
  const L = Array.from({ length: n }, () => ({ st: 0, x: 0, y: -50, z: 0, vx: 0, vz: 0, rx: 0, ry: 0, rz: 0, sx: 0, sy: 0, sz: 0, ph: 0, t: 0, s: 0, kind: 0 }));
  const o = new THREE.Object3D(), windDir = new THREE.Vector2(1, 0.35).normalize();
  for (let i = 0; i < n; i++) mesh.setColorAt(i, LEAF[0]);
  scene.add(mesh);
  let acc = 0;
  function spawn(kind) {
    const idx = L.findIndex((q) => q.st === 0); if (idx < 0) return;
    const lf = L[idx];
    const b = trees.randomBlob();
    if (b && rnd() < 0.6) { lf.x = b.world.x + rand(-0.7, 0.7) * b.scale; lf.y = b.world.y + rand(-0.4, 0.3) * b.scale; lf.z = b.world.z + rand(-0.7, 0.7) * b.scale; }
    else { const a = rand(0, TAU), r = rand(0, 11); lf.x = Math.cos(a) * r - 2; lf.z = Math.sin(a) * r; lf.y = rand(4, 7); }
    lf.st = 1; lf.kind = kind; lf.ph = rand(0, TAU);
    lf.s = kind ? rand(0.09, 0.14) : rand(0.2, 0.3);
    lf.rx = rand(0, TAU); lf.ry = rand(0, TAU); lf.rz = rand(0, TAU);
    lf.sx = rand(-3, 3); lf.sy = rand(-2, 2); lf.sz = rand(-3, 3);
    mesh.setColorAt(idx, pick(kind ? PETAL : LEAF));
    mesh.instanceColor.needsUpdate = true;
  }
  return {
    update(dt, c) {
      const amount = Math.max(c.leaves, c.petals * 0.8);
      const goalAmt = Math.max(goal.leaves, goal.petals);
      acc += dt * 14 * amount;
      const kind = c.petals > c.leaves ? 1 : 0;
      while (acc >= 1) { acc -= 1; spawn(kind); }
      const wind = 0.35 + env.wind * 1.1;
      for (let i = 0; i < n; i++) {
        const lf = L[i];
        if (lf.st === 0) { o.position.set(0, -50, 0); o.rotation.set(0, 0, 0); o.scale.setScalar(1e-4); o.updateMatrix(); mesh.setMatrixAt(i, o.matrix); continue; }
        let sc = lf.s;
        if (lf.st === 1) {
          const fallV = lf.kind ? 0.28 : 0.42;
          lf.y -= (fallV + Math.sin(time * 2.1 + lf.ph) * 0.18) * dt;
          lf.x += (windDir.x * wind + Math.sin(time * 1.3 + lf.ph) * 0.55) * dt;
          lf.z += (windDir.y * wind + Math.cos(time * 1.1 + lf.ph) * 0.4) * dt;
          lf.rx += lf.sx * dt; lf.ry += lf.sy * dt; lf.rz += lf.sz * dt;
          const inPond = pondD(lf.x, lf.z) < 0.97;
          const ground = inPond ? 0.016 : terrainH(lf.x, lf.z) + 0.03;
          if (lf.y <= ground) {
            lf.y = ground;
            if (inPond) { lf.st = 2; lf.t = rand(18, 34); lf.vx = rand(-0.07, 0.07); lf.vz = rand(-0.07, 0.07); if (rnd() < 0.2) addRipple(lf.x, lf.z, 0.22); }
            else { lf.st = 3; lf.t = rand(8, 16); }
            lf.rx = -Math.PI / 2; lf.ry = 0;
          }
          if (Math.hypot(lf.x, lf.z) > 30) lf.st = 0;
        } else {
          if (goalAmt < 0.05) lf.t = Math.min(lf.t, 5);
          lf.t -= dt;
          if (lf.st === 2) {
            lf.x += (lf.vx + windDir.x * 0.04 * wind) * dt; lf.z += (lf.vz + windDir.y * 0.04 * wind) * dt;
            if (pondD(lf.x, lf.z) > 0.97) { lf.vx *= -1; lf.vz *= -1; lf.x *= 0.99; lf.z *= 0.99; }
            lf.y = 0.016 + rippleHeight(lf.x, lf.z) * 1.2;
            lf.rz += lf.sz * 0.02 * dt;

          if (lf.t < 0) sc *= Math.max(0, 1 + lf.t);
          if (lf.t < -1) lf.st = 0;
        }
        o.position.set(lf.x, lf.y, lf.z);
        o.rotation.set(lf.rx, lf.ry, lf.rz);
        o.scale.set(sc * (lf.kind ? 1 : 0.7), sc, sc);
        o.updateMatrix();
        mesh.setMatrixAt(i, o.matrix);
      }

    },
  };
})();

/* ---------- birds (spring): fly around, then perch on the stone lanterns ---------- */
const birds = (() => {
  const perches = [];
  lanterns.forEach((l) => {
    perches.push({ p: l.group.localToWorld(new THREE.Vector3(0, 2.1, 0)), yaw: rand(0, TAU), busy: false });
    perches.push({ p: l.group.localToWorld(new THREE.Vector3(0.28, 1.18, 0.28)), yaw: rand(0, TAU), busy: false });
    perches.push({ p: l.group.localToWorld(new THREE.Vector3(-0.28, 1.18, -0.28)), yaw: rand(0, TAU), busy: false });
  });
  const tones = [[0x7a5a3c, 0xd9c3a0], [0x5f636c, 0xe0dcd2], [0x8a4b2a, 0xe7c29a], [0x6b5a44, 0xcfbfa2], [0x3f4652, 0xd8d2c4]];
  const beakMat = new THREE.MeshStandardMaterial({ color: 0xe0a030, roughness: 0.6 });
  const eyeM = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.2 });
  const S = 2.3;
  const list = tones.map(([back, belly], i) => {
    const root = new THREE.Group();
    const inner = new THREE.Group();
    root.add(inner);
    inner.scale.setScalar(S); inner.position.y = 0.06 * S;
    const bm = new THREE.MeshStandardMaterial({ color: back, roughness: 0.8 });
    const lm = new THREE.MeshStandardMaterial({ color: belly, roughness: 0.85 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 9), bm); body.scale.set(0.062, 0.058, 0.12);
    const bellyM = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 9), lm); bellyM.scale.set(0.055, 0.045, 0.1); bellyM.position.set(0, -0.016, 0.01);
    const head = new THREE.Group(); head.position.set(0, 0.045, 0.1);
    const hm = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 9), bm);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.045, 6), beakMat); beak.rotation.x = Math.PI / 2; beak.position.set(0, -0.004, 0.058);
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.009, 6, 5), eyeM); e1.position.set(0.034, 0.012, 0.028);
    const e2 = e1.clone(); e2.position.x = -0.034;
    head.add(hm, beak, e1, e2);
    const tailG = new THREE.BufferGeometry();
    tailG.setAttribute("position", new THREE.Float32BufferAttribute([-0.035, 0.01, -0.1, 0.035, 0.01, -0.1, 0, 0.02, -0.21], 3));
    tailG.computeVertexNormals();
    const tail = new THREE.Mesh(tailG, new THREE.MeshStandardMaterial({ color: back, side: THREE.DoubleSide, roughness: 0.8 }));
    const wingMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(back).multiplyScalar(0.8), side: THREE.DoubleSide, roughness: 0.8 });
    const wings = [-1, 1].map((sd) => {
      const pv = new THREE.Group(); pv.position.set(sd * 0.045, 0.03, 0.01);
      const wg = new THREE.BufferGeometry();
      wg.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0.05, 0, 0, -0.06, sd * 0.2, 0, -0.04, 0, 0, 0.05, sd * 0.2, 0, -0.04, sd * 0.13, 0, 0.03], 3));
      wg.computeVertexNormals();
      pv.add(new THREE.Mesh(wg, wingMat)); inner.add(pv);
      return { pv, sd };
    });
    inner.add(body, bellyM, head, tail);
    root.traverse((m) => { m.layers.set(1); if (m.isMesh) m.castShadow = true; });
    root.rotation.order = "YXZ";
    root.visible = false;
    scene.add(root);
    return {
      root, inner, head, wings, st: "away", pos: new THREE.Vector3(0, -50, 0), vel: new THREE.Vector3(),
      yaw: 0, pitch: 0, t: 0, phase: rand(0, TAU), seed: rand(0, 100), perch: null,
      ang: rand(0, TAU), rad: rand(6, 10), alt: rand(3, 5), dir: rnd() < 0.5 ? -1 : 1, delay: i * 1.3,
    };
  });
  const tgt = new THREE.Vector3(), tmp = new THREE.Vector3(), des = new THREE.Vector3();
  function seek(b, maxSp, arriveK, k, dt) {
    tmp.subVectors(tgt, b.pos);
    const d = tmp.length();
    if (d > 1e-4) des.copy(tmp).multiplyScalar(Math.min(maxSp, d * arriveK) / d); else des.set(0, 0, 0);
    b.vel.lerp(des, 1 - Math.exp(-dt * k));

  }
  return {
    list,
    update(dt) {
      const want = goal.birds > 0.5;
      for (const b of list) {
        if (b.st === "away") {
          if (!want) continue;
          b.delay -= dt; if (b.delay > 0) continue;
          const a = rand(0, TAU);
          b.pos.set(Math.cos(a) * 26, rand(6, 8), Math.sin(a) * 26);
          b.vel.set(-Math.cos(a) * 3, -0.5, -Math.sin(a) * 3);
          b.yaw = Math.atan2(b.vel.x, b.vel.z);
          b.st = "fly"; b.t = rand(4, 8); b.root.visible = true;
        }
        if (!want && b.st !== "leave") {
          if (b.perch) { b.perch.busy = false; b.perch = null; }
          b.st = "leave"; b.vel.y = Math.max(b.vel.y, 1.5);

        if (b.st === "fly") {
          b.ang += dt * 0.42 * b.dir;
          tgt.set(Math.cos(b.ang) * b.rad, b.alt + Math.sin(time * 0.7 + b.seed) * 0.6, Math.sin(b.ang) * b.rad);
          seek(b, 3.4, 99, 1.4, dt);
          b.t -= dt;
          if (b.t <= 0) {
            const free = perches.filter((p) => !p.busy);
            if (free.length) { b.perch = pick(free); b.perch.busy = true; b.st = "land"; }
            else b.t = rand(3, 6);

          const dxz = Math.hypot(pp.x - b.pos.x, pp.z - b.pos.z);

          if (dxz < 0.9 && d < 0.05 + dt * 1.5) {
            b.pos.copy(pp); b.vel.set(0, 0, 0); b.st = "perch"; b.t = rand(12, 25); b.yaw = b.perch.yaw + rand(-0.6, 0.6);
          }
        } else if (b.st === "perch") {
          b.t -= dt;
          if (rnd() < dt * 0.25) b.yaw += rand(-0.9, 0.9);
          if (b.t <= 0) {
            b.perch.busy = false; b.perch = null; b.st = "fly"; b.t = rand(4, 8);
            b.vel.set(Math.sin(b.yaw) * 1.5, 2.4, Math.cos(b.yaw) * 1.5);
            b.ang = Math.atan2(b.pos.z, b.pos.x);
          }
        } else if (b.st === "leave") {
          tgt.set(b.pos.x, 0, b.pos.z); if (tgt.lengthSq() < 1) tgt.set(1, 0, 0);
          tgt.normalize().multiplyScalar(40); tgt.y = 12;
          seek(b, 5, 99, 1.5, dt);
          if (Math.hypot(b.pos.x, b.pos.z) > 32) { b.st = "away"; b.root.visible = false; b.delay = rand(0, 3); }
        }
        if (b.st !== "perch") b.pos.addScaledVector(b.vel, dt);
        const hs = Math.hypot(b.vel.x, b.vel.z);
        if (b.st !== "perch" && hs > 0.15) {
          b.yaw += wrap(Math.atan2(b.vel.x, b.vel.z) - b.yaw) * (1 - Math.exp(-dt * 6));
          b.pitch = lerp(b.pitch, clamp(Math.atan2(b.vel.y, hs), -0.6, 0.6), 1 - Math.exp(-dt * 5));
        } else b.pitch = lerp(b.pitch, 0, 1 - Math.exp(-dt * 6));
        b.root.position.copy(b.pos);
        b.root.rotation.set(-b.pitch, b.yaw, 0);
        if (b.st === "perch") {
          const peck = Math.pow(Math.max(0, Math.sin(time * 2.6 + b.seed)), 10);
          b.head.rotation.set(peck * 0.9, Math.sin(time * 0.9 + b.seed) * 0.5, 0);
          for (const w of b.wings) w.pv.rotation.set(0, w.sd * 1.25, -w.sd * 0.15);
        } else {
          b.head.rotation.set(0, 0, 0);
          const glide = b.st === "fly" && Math.sin(time * 0.8 + b.seed) > 0.45;
          b.phase += dt * (b.st === "land" ? 22 : 17);
          const flap = glide ? 0.12 : Math.sin(b.phase) * 0.95;
          for (const w of b.wings) w.pv.rotation.set(0, w.sd * 0.12, w.sd * flap);
        }
      }
    },

})();

/* ---------- apply presets ---------- */
let snowCover = 0, flash = 0;
const flashPulses = [];
const WHITE = new THREE.Color(0.92, 0.94, 1.0);
function applyPreset(dt) {
  const k = dt < 0 ? 1 : 1 - Math.exp(-dt * 1.4);
  const ks = dt < 0 ? 1 : 1 - Math.exp(-dt * 0.5);
  for (const key of COLOR_KEYS) cur[key].lerp(goal[key], key.startsWith("canopy") ? ks : k);
  cur.sunDir.lerp(goal.sunDir, k).normalize(); cur.absorb.lerp(goal.absorb, k);
  for (const key of NUM_KEYS) cur[key] = lerp(cur[key], goal[key], SLOW_KEYS.has(key) ? ks : k);
  snowCover = dt < 0 ? goal.snow : approach(snowCover, goal.snow, dt * (goal.snow > snowCover ? 0.05 : 0.12));

  const fl = flash;
  sun.color.copy(cur.sun); sun.intensity = cur.sunI; sun.position.copy(cur.sunDir).multiplyScalar(34);
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGround); hemi.intensity = cur.hemiI + fl * 2.6;
  flashLight.intensity = fl * 4.5;
  scene.background.copy(cur.bg).lerp(WHITE, fl * 0.5); scene.fog.color.copy(scene.background);
  scene.fog.near = cur.fogNear; scene.fog.far = cur.fogFar;
  U.uSunCol.value.copy(cur.sun).multiplyScalar(cur.sunI * 0.42); U.uWaterCol.value.copy(cur.water);
  U.uAbsorb.value.copy(cur.absorb); U.uCausticAmt.value = cur.caustic;
  U.uSnowCover.value = snowCover; U.uDry.value = cur.dry;
  snowLight.setRGB(0.93, 0.95, 1.0).multiplyScalar(cur.hemiI * 0.62 + cur.sunI * 0.2 + cur.lantern * 0.05 + fl * 0.8);
  const wu = waterMat.uniforms;
  wu.uSkyTop.value.copy(cur.skyTop).lerp(WHITE, fl * 0.8); wu.uSkyHor.value.copy(cur.skyHor).lerp(WHITE, fl * 0.8);
  wu.uCloudCol.value.copy(cur.cloudCol).lerp(WHITE, fl * 0.8);
  wu.uSunDir.value.copy(cur.sunDir); wu.uSunCol.value.copy(cur.sun); wu.uSpec.value = cur.spec;
  wu.uCloud.value = cur.cloud; wu.uRain.value = cur.rain * 0.9; wu.uWind.value = cur.wind;
  renderer.toneMappingExposure = cur.exposure + fl * 0.25;
  lanterns.forEach((l) => { l.glow.emissiveIntensity = cur.lantern * 3.2; l.light.intensity = cur.lantern * 16; });
  flies.uniforms.uOpacity.value = cur.fire;
  rain.uniforms.uDensity.value = cur.rain; rain.uniforms.uWind.value = cur.wind;
  rain.uniforms.uColor.value.setRGB(0.78, 0.83, 0.88).multiplyScalar(0.55 + cur.hemiI * 0.35 + fl * 0.8);
  snowFx.uniforms.uDensity.value = cur.snow; snowFx.uniforms.uWind.value = cur.wind;
  snowFx.uniforms.uColor.value.copy(snowLight).multiplyScalar(1.05);
  drops.material.uniforms.uColor.value.setRGB(0.85, 0.92, 0.96).multiplyScalar(0.5 + cur.hemiI * 0.4 + cur.sunI * 0.08);
  env.activity = cur.activity; env.deep = cur.deep; env.wind = cur.wind;
  lotusFlowers.forEach((lf) => {
    const g = lf.base ? 1 : smooth(0, 1, cur.lotus * 1.3 - lf.rank * 0.3);
    lf.flower.visible = g > 0.01;
    lf.flower.scale.setScalar(Math.max(g, 1e-3));
  });
}

/* ---------- lightning & thunder: every thunderclap sends the fish into hiding ---------- */
let nextStrike = 4;
const pendingThunder = [];
function strike() {
  const n = 2 + Math.floor(rnd() * 3);
  let t = time;
  for (let i = 0; i < n; i++) { flashPulses.push({ at: t, amp: rand(0.55, 1) }); t += rand(0.06, 0.16); }
  const near = rnd();
  pendingThunder.push({ at: time + lerp(2.4, 0.25, near), near });
}
function updateLightning() {
  if (goal.storm > 0.5 && cur.storm > 0.5 && time >= nextStrike) { strike(); nextStrike = time + rand(5, 11); }
  flash = 0;
  for (let i = flashPulses.length - 1; i >= 0; i--) {
    const age = time - flashPulses[i].at;
    if (age > 1) { flashPulses.splice(i, 1); continue; }
    if (age >= 0) flash += flashPulses[i].amp * Math.exp(-age * 16);
  }
  flash = Math.min(flash, 1.3);
  for (let i = pendingThunder.length - 1; i >= 0; i--) {
    const th = pendingThunder[i];
    if (time < th.at) continue;
    pendingThunder.splice(i, 1);
    thunderSound(th.near);
    scatter(null, 7 + th.near * 5);
  }
}

/* ---------- fish jumps ---------- */
let nextJump = 5;
function tryJump(force = false) {
  if (!force && pellets.length) return false;
  const cands = fishes.filter((f) => !f.jump && f.flee <= 0 && f.hideT <= 0).sort(() => rnd() - 0.5);
  for (const f of cands) if (f.startJump()) return true;
  return false;
}

/* ---------- sound: music per scene + synthesized thunder ---------- */
const musicBtn = document.getElementById("music"), musicLabel = document.getElementById("music-label");
const statusEl = document.getElementById("music-status"), volEl = document.getElementById("music-vol");
let soundOn = false, volume = Number(volEl.value), actx = null, master = null, brown = null;
const tracks = [];
const probeCache = {};
let musicToken = 0;

function probe(name) {
  if (probeCache[name]) return probeCache[name];
  probeCache[name] = new Promise((resolve) => {
    let i = 0;
    const tryNext = () => {
      if (i >= MUSIC_EXTS.length) { resolve(null); return; }
      const url = `${MUSIC_DIR}${name}.${MUSIC_EXTS[i++]}`;
      const a = new Audio();
      a.preload = "metadata";
      const done = (ok) => { a.onloadedmetadata = a.onerror = null; clearTimeout(timer); ok ? resolve(url) : tryNext(); };
      const timer = setTimeout(() => done(false), 15000);
      a.onloadedmetadata = () => done(true);
      a.onerror = () => done(false);
      a.src = url;
    };
    tryNext();
  });
  return probeCache[name];
}
function setStatus(html) { statusEl.innerHTML = html; statusEl.hidden = !html; }
function fadeOutAll() { tracks.forEach((t) => { t.target = 0; }); }
async function playSceneMusic(name) {
  const token = ++musicToken;
  if (!soundOn) return;
  let url = null, usedDefault = false;
  for (const cand of SCENE_MUSIC[name]) { url = await probe(cand); if (url) break; }
  if (!url) { url = await probe("default"); usedDefault = !!url; }
  if (token !== musicToken || !soundOn) return;
  const label = (u) => `Đang phát <code>${u.split("/").pop()}</code>${usedDefault ? ` cho cảnh ${SCENE_LABEL[name]}` : ""}`;
  const playing = tracks.find((t) => t.target > 0);
  if (url && playing && playing.url === url) { setStatus(label(url)); return; }
  fadeOutAll();
  if (!url) {
    setStatus(`Cảnh <b>${SCENE_LABEL[name]}</b> chưa có nhạc. Thêm file <code>music/${SCENE_MUSIC[name][0]}.mp3</code>`);
    return;
  }
  const el = new Audio(url);
  el.loop = true; el.volume = 0;
  tracks.push({ el, url, fade: 0, target: 1 });
  try { await el.play(); } catch (err) { setStatus("Trình duyệt chặn phát nhạc. Bấm nút Nhạc thêm lần nữa."); return; }
  setStatus(label(url));
}
function updateMusic(dt) {
  for (let i = tracks.length - 1; i >= 0; i--) {
    const t = tracks[i];
    t.fade = approach(t.fade, t.target, dt / 1.6);
    t.el.volume = clamp(t.fade * volume, 0, 1);
    if (t.target === 0 && t.fade === 0) { t.el.pause(); t.el.removeAttribute("src"); t.el.load(); tracks.splice(i, 1); }
  }
}
function ensureAudioContext() {
  if (actx) { actx.resume?.(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = volume; master.connect(actx.destination);
  const sr = actx.sampleRate, len = Math.floor(sr * 7);
  brown = actx.createBuffer(1, len, sr);
  const d = brown.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
}
function thunderSound(near) {
  if (!soundOn || !actx) return;
  const t0 = actx.currentTime, dur = 3.4 + (1 - near) * 2.4;
  const src = actx.createBufferSource(); src.buffer = brown;
  const lp = actx.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(180 + near * 800, t0); lp.frequency.exponentialRampToValueAtTime(70, t0 + dur);
  const g = actx.createGain(); const peak = 0.45 + near * 0.9;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + (near > 0.6 ? 0.03 : 0.4));
  for (let t = t0 + 0.45; t < t0 + dur - 0.6; t += 0.15 + Math.random() * 0.35) {
    g.gain.linearRampToValueAtTime(peak * (0.25 + Math.random() * 0.6) * (1 - (t - t0) / dur), t);
  }
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(lp).connect(g).connect(master);
  src.start(t0, Math.random() * 1.5, dur);
  if (near > 0.6) {
    const c = actx.createBufferSource(); c.buffer = brown;
    const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const cg = actx.createGain(); cg.gain.setValueAtTime(0.0001, t0);
    cg.gain.exponentialRampToValueAtTime(0.9 * near, t0 + 0.01); cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    c.connect(hp).connect(cg).connect(master); c.start(t0, Math.random() * 3, 0.4);
  }
}
function toggleSound() {
  soundOn = !soundOn;
  musicBtn.setAttribute("aria-pressed", String(soundOn));
  musicLabel.textContent = soundOn ? "Tắt nhạc" : "Bật nhạc";
  if (soundOn) { ensureAudioContext(); setStatus("Đang tìm nhạc…"); playSceneMusic(sceneName); }
  else { musicToken++; fadeOutAll(); setStatus(""); }
}
musicBtn.addEventListener("click", toggleSound);
volEl.addEventListener("input", () => { volume = Number(volEl.value); if (master) master.gain.value = volume; });

/* ---------- scene switching ---------- */
const dock = document.getElementById("dock");
function setScene(name, instant = false) {
  if (!PRESETS[name]) return;
  sceneName = name;
  goal = toState(PRESETS[name]);
  if (goal.storm > 0.5) nextStrike = time + rand(1.5, 3.5);
  if (goal.jump > 0.05) nextJump = Math.min(nextJump, time + rand(3, 7) / goal.jump);
  if (instant) applyPreset(-1);
  document.querySelectorAll("[data-scene]").forEach((b) => {
    const on = b.dataset.scene === name;
    b.setAttribute("aria-pressed", String(on));
    if (on && dock.scrollWidth > dock.clientWidth) dock.scrollLeft = b.offsetLeft - (dock.clientWidth - b.offsetWidth) / 2;
  });
  playSceneMusic(name);
}
document.querySelectorAll("[data-scene]").forEach((btn) => btn.addEventListener("click", () => setScene(btn.dataset.scene)));
document.getElementById("scatter").addEventListener("click", () => scatter());
applyPreset(-1);

/* ---------- input ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
let down = null;
canvas.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener("pointerup", (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dur = performance.now() - down.t;
  down = null;
  if (moved > 6 || dur > 450) return;
  const rect = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(plane, hit) && pondD(hit.x, hit.z) < 0.95) dropFood(hit.x, hit.z);
});
window.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); scatter(); }
  if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
  if (e.key === "m" || e.key === "M") toggleSound();
  const n = Number(e.key);
  if (n >= 1 && n <= 9) setScene(SCENE_KEYS[n - 1]);
});

/* ---------- resize ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 55 : 40;
  camera.updateProjectionMatrix();
  makeTarget();
  waterMat.uniforms.uRes.value.set(size.x, size.y);
}
window.addEventListener("resize", resize);
resize();
if (window.innerWidth / window.innerHeight < 0.9) camera.position.set(0, 20, 12);

/* ---------- simulation step & render loop ---------- */
let demoFed = false;
function step(dt) {
  time += dt;
  U.uTime.value = time;
  updateLightning();
  applyPreset(dt);
  updateMusic(dt);
  if (!demoFed && time > 1.2) { demoFed = true; dropFood(1.2, 0.8); }
  if (cur.jump > 0.05 && time >= nextJump) { nextJump = time + rand(6, 15) / Math.max(cur.jump, 0.1); tryJump(); }

  pellets.forEach((p) => {
    p.x += p.vx * dt; p.z += p.vz * dt;
    if (pondD(p.x, p.z) > 0.9) { p.vx *= -1; p.vz *= -1; }
    if (time - p.born > 30) p.eaten = true;
    p.mesh.position.set(p.x, 0.02 + rippleHeight(p.x, p.z) + Math.sin(time * 2 + p.born) * 0.01, p.z);
  });
  pellets = pellets.filter((p) => { if (p.eaten) scene.remove(p.mesh); return !p.eaten; });

  for (const f of fishes) f.update(dt, fishes, pellets, fleeFrom);
  pads.forEach((p) => {
    p.group.position.y = 0.03 + rippleHeight(p.x, p.z) * 1.5 + Math.sin(time * (0.8 + env.wind) + p.ph) * (0.008 + env.wind * 0.012);
    p.group.rotation.y += p.spin * (1 + env.wind * 2) * dt;
    p.group.rotation.x = Math.sin(time * 0.7 + p.ph) * (0.015 + env.wind * 0.03);
  });
  reeds.update(time, env.wind);
  trees.update(cur);
  meadow.update(cur.bloom);
  fall.update(dt, cur);
  birds.update(dt);
  drops.update(dt);
}
function render() {
  for (const f of fishes) f.draw();
  controls.update();
  renderer.shadowMap.needsUpdate = true;
  camera.layers.set(0);
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  camera.layers.enableAll();
  waterMat.uniforms.uScene.value = rt.texture;
  waterMat.uniforms.uDepth.value = rt.depthTexture;
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}
window.andylePool = {
  setScene, strike, jump: () => tryJump(true),
  advance(sec) { for (let t = 0; t < sec; t += 1 / 30) step(1 / 30); },
  fish: fishes, birds: birds.list,
};

let last = performance.now(), first = true;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  step(dt);
  render();
  if (first) { first = false; document.getElementById("loading").classList.add("done"); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
